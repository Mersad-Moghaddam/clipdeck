name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Installer and workflow regression tests
        run: |
          bash packaging/tests/install_test.sh
          python3 packaging/tests/workflow_test.py

      - name: Vet / Lint
        run: |
          go vet ./...

      - name: Run tests with race detector
        run: |
          go test -race -v ./...

      - name: Build binaries
        run: |
          make build
