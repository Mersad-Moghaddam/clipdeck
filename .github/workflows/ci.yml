name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Vet / Lint
        run: |
          go vet ./...

      - name: Run tests with race detector
        run: |
          go test -race -v ./...

      - name: Build binaries
        run: |
          make build
